<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up Form</title>
</head>
<body>
    <div class="panel-container">
        <div class="banner-container">

            <div class="background-img"><img src="images/pinetrees.jpg" alt="Pine trees in a rainy weather"></div>
            <div class="logo-band">

            <div class="odin-img"><img src="images/odin-lined.png" alt="Odin image"></div>
            <div class="odin-txt">ODIN</div>
                </div>    
                <div>Image by <a href="https://unsplash.com/@mostly_brave"> Jonathan Klok </a> on unsplash</div>
        </div>
        <div class="form-container">
        <div class="description"><b>This is a signup form project! Please fill in your details below to sumbit your information</b></div>

        <form action="#" method="get" class="form-box">
            <div class="form-row">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="John" required>
            </div>

            <div class="form-row">
                <label for="family-name">Family name</label>
                <input id="family-name" name="family-name" type="text" placeholder="Smith" required>
            </div>

            <div class="form-row">
                <label for="email">Email adress</label>
                <input id="email" name="email" type="email" placeholder="johnsmith12@gmail.com" required>
            </div>

            <div class="form-row">
                <label for="phone">Phone number</label>
                <small>Ex: 123-456-7890</small>
                <input id="phone" name="phone" type="tel" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
            </div>

            <div class="form-row">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="********" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
            </div>

            <div class="form-row">
                <label for="confirm-password">Confirm Password</label>
                <input id="confirm-password" name="confirmPassword" type="password" placeholder="********" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
            </div>
            <button type="submit">Create account</button>
        </div>
        </form>
</body>
<footer>

</footer>
</html>
