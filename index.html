<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up Form</title>
</head>
<body>
    <div class="panel-container">
        <div class="banner-container">

            <div class="background-img"><img src="images/pinetrees.jpg" alt="Pine trees in a rainy weather"></div>

            <div class="logo-band">

            <div class="odin-img"><img src="images/odin-lined.png" alt="Odin image"></div>
            <div class="odin-txt">ODIN</div>

            </div>                
        </div>
        <div class="form-container"></div>
        <div class="description">This is a signup form project!</div>


        <form action="" method="get" class="form-box">
            <div class="form-row">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="John">
            </div>

            <div class="form-row">
                <label for="family-name">Family name</label>
                <input id="family-name" name="family-name" type="text" placeholder="Smith">
            </div>

            <div class="form-row">
                <label for="email">Email adress</label>
                <input id="email" name="email" type="email" placeholder="johnsmith12@gmail.com">
            </div>

            <div class="form-row">
                <label for="phone">Phone number</label>
                <input id="phone" name="phone" type="text" placeholder="+49--------">
            </div>

            <div class="form-row">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="********">
            </div>

            <div class="form-row">
                <label for="confirm-password">Confirm Password</label>
                <input id="confirm-password" name="confirmPassword" type="password" placeholder="********">
            </div>






        </form>

    </div>
</body>
<footer>
    <div>Image by <a href="https://unsplash.com/@mostly_brave"> Jonathan Klok </a> on unsplash</div>
</footer>
</html>
